
  <!-- ==================== LOGIN PAGE ==================== -->
  <div id="loginPage" class="login-container">
    <div class="w-full max-w-md px-6">
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
          <i id="loginLogoIcon" class="fa-solid fa-spinner fa-spin text-4xl text-teal-500 mb-4"></i>
          <p class="text-slate-500 text-sm mt-2">Fitness Club Monitoring System</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
            <input 
              type="email" 
              id="loginEmail" 
              placeholder="nama@gmail.com" 
              required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none"
            >
            <p class="text-xs text-slate-500 mt-1">Format: nama@gmail.com</p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
            <input 
              type="password" 
              id="loginPassword" 
              placeholder="Masukkan password" 
              required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none"
            >
          </div>

          <div id="loginError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl text-sm"></div>

          <div class="flex items-center">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 accent-teal-500 cursor-pointer">
            <label for="rememberMe" class="ml-2 text-sm text-slate-600 cursor-pointer">Remember Me</label>
          </div>

          <button 
            type="submit" 
            class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2.5 rounded-xl transition-all btn-press"
          >
            <i class="fa-solid fa-right-to-bracket mr-2"></i> Login
          </button>
        </form>
      </div>
    </div>
  </div>
