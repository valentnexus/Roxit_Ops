      <!-- ==================== STAFF PAGE ==================== -->
      <section id="staffPage" class="space-y-6 hidden">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 border-b pb-4 border-slate-200 gap-4">
            <div class="flex items-center space-x-3">
              <i class="fa-solid fa-users text-2xl text-emerald-600"></i>
              <h2 class="text-2xl font-extrabold text-slate-800">Staff</h2>
            </div>
            <button onclick="openUserModal()" id="staffAddBtn" class="w-full md:w-auto bg-teal-500 hover:bg-teal-600 text-white font-bold py-2 px-4 rounded-lg transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus"></i> Add Staff
            </button>
          </div>

          <!-- Search & Filter -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="relative">
              <input type="text" id="staffSearch" placeholder="Search by name..." class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none" onkeyup="filterStaffTable()">
              <i class="fa-solid fa-search absolute right-3 top-2.5 text-slate-400"></i>
            </div>
            <select id="staffStatusFilter" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none" onchange="loadStaffListByStatus()">
              <option value="active">Active Staff</option>
              <option value="archived">Archived Staff</option>
            </select>
            <select id="roleFilter" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none" onchange="filterStaffTable()">
              <option value="">-- All Roles --</option>
            </select>
            <select id="clubFilter" class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-teal-500 outline-none" onchange="filterStaffTable()">
              <option value="">-- All Clubs --</option>
            </select>
          </div>

          <!-- Staff Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-100">
                <tr>
                  <th class="px-4 py-2 text-left font-bold text-slate-700">User ID</th>
                  <th class="px-4 py-2 text-left font-bold text-slate-700">Name</th>
                  <th class="px-4 py-2 text-left font-bold text-slate-700">Role</th>
                  <th class="px-4 py-2 text-left font-bold text-slate-700">Club</th>
                  <th class="px-4 py-2 text-left font-bold text-slate-700">Email</th>
                  <th class="px-4 py-2 text-left font-bold text-slate-700">Phone</th>
                  <th class="px-4 py-2 text-center font-bold text-slate-700">Action</th>
                </tr>
              </thead>
              <tbody id="staffTableBody">
                <tr>
                  <td colspan="7" class="px-4 py-4 text-center text-slate-400">
                    <i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat staff...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
