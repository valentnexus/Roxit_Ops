      <!-- ==================== ADMIN OPS PAGE ==================== -->
      <section id="adminOpsPage" class="space-y-6 hidden">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
          <div class="flex items-center space-x-3 mb-6 border-b pb-4 border-slate-200">
            <i class="fa-solid fa-cogs text-2xl text-purple-600"></i>
            <h2 class="text-2xl font-extrabold text-slate-800">Admin Operations</h2>
          </div>

          <!-- Dashboard Stats -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-yellow-50 rounded-xl p-4 border border-yellow-200">
              <p class="text-xs font-bold text-yellow-600 uppercase">Total Pending</p>
              <p id="statPending" class="text-3xl font-extrabold text-yellow-700 mt-2">0</p>
            </div>
            <div class="bg-green-50 rounded-xl p-4 border border-green-200">
              <p class="text-xs font-bold text-green-600 uppercase">Approved Today</p>
              <p id="statApprovedToday" class="text-3xl font-extrabold text-green-700 mt-2">0</p>
            </div>
            <div class="bg-red-50 rounded-xl p-4 border border-red-200">
              <p class="text-xs font-bold text-red-600 uppercase">Rejected Today</p>
              <p id="statRejectedToday" class="text-3xl font-extrabold text-red-700 mt-2">0</p>
            </div>
            <div class="bg-blue-50 rounded-xl p-4 border border-blue-200">
              <p class="text-xs font-bold text-blue-600 uppercase">Total Staff Aktif</p>
              <p id="statActiveStaff" class="text-3xl font-extrabold text-blue-700 mt-2">0</p>
            </div>
          </div>

          <!-- Pending Approvals (Tabs, each with its own Recent Activity) -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
            <h3 class="font-bold text-lg text-slate-800">Approvals</h3>
            <button type="button" onclick="refreshAdminOpsData()" id="approvalRefreshBtn" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-2 rounded-lg transition">
              <i class="fa-solid fa-rotate mr-1"></i> Refresh
            </button>
          </div>

          <div class="flex border-b border-slate-200 mb-4 overflow-x-auto">
            <button onclick="switchApprovalTab('PT')" class="approval-tab flex-1 px-4 py-3 font-bold text-center border-b-2 border-teal-500 text-teal-700 hover:bg-slate-50 transition whitespace-nowrap" data-approval-tab="PT">
              <i class="fa-solid fa-user mr-2"></i> Personal Training
              <span id="approvalBadge-PT" class="ml-2 inline-block min-w-[1.25rem] px-1.5 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800">0</span>
            </button>
            <button onclick="switchApprovalTab('GROUP')" class="approval-tab flex-1 px-4 py-3 font-bold text-center border-b-2 border-transparent text-slate-700 hover:bg-slate-50 transition whitespace-nowrap" data-approval-tab="GROUP">
              <i class="fa-solid fa-users mr-2"></i> Group
              <span id="approvalBadge-GROUP" class="ml-2 inline-block min-w-[1.25rem] px-1.5 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800">0</span>
            </button>
            <button onclick="switchApprovalTab('TIO')" class="approval-tab flex-1 px-4 py-3 font-bold text-center border-b-2 border-transparent text-slate-700 hover:bg-slate-50 transition whitespace-nowrap" data-approval-tab="TIO">
              <i class="fa-solid fa-clock mr-2"></i> Time In/Out
              <span id="approvalBadge-TIO" class="ml-2 inline-block min-w-[1.25rem] px-1.5 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800">0</span>
            </button>
          </div>

          <div class="flex flex-col md:flex-row gap-3 mb-4">
            <input type="text" id="approvalSearchInput" placeholder="Cari nama staff atau member..." oninput="renderApprovalTable(); renderRecentTable();" class="flex-1 px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-sky-500 outline-none">
            <select id="approvalStatusFilter" onchange="renderApprovalTable()" class="text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 outline-none">
              <option value="Pending" selected>Pending</option>
              <option value="Success">Success</option>
              <option value="Rejected">Rejected</option>
              <option value="all">All Status</option>
            </select>
          </div>

          <!-- Pending Approvals Table (isi & kolom mengikuti tab aktif) -->
          <div class="mb-8">
            <h4 id="approvalTableTitle" class="font-bold text-slate-700 mb-3">Pending Approvals - Personal Training</h4>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead id="approvalTableHead" class="bg-slate-100"></thead>
                <tbody id="approvalTableBody">
                  <tr>
                    <td colspan="7" class="px-4 py-4 text-center text-slate-400">
                      <i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat data...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Recent Activity Table (20 record terakhir per tab aktif, sudah diproses) -->
          <div>
            <h4 id="recentTableTitle" class="font-bold text-slate-700 mb-3">Recent Activity - Personal Training</h4>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-slate-100">
                  <tr>
                    <th class="px-4 py-2 text-left font-bold text-slate-700">Waktu Diproses</th>
                    <th class="px-4 py-2 text-left font-bold text-slate-700">Staff</th>
                    <th class="px-4 py-2 text-left font-bold text-slate-700">Member</th>
                    <th class="px-4 py-2 text-left font-bold text-slate-700">Status</th>
                    <th class="px-4 py-2 text-left font-bold text-slate-700">Admin Notes</th>
                  </tr>
                </thead>
                <tbody id="recentTableBody">
                  <tr>
                    <td colspan="5" class="px-4 py-4 text-center text-slate-400">
                      <i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat data...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
