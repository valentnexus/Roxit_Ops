      <!-- ==================== CHANGE PASSWORD PAGE ==================== -->
      <section id="changePasswordPage" class="space-y-6 hidden">
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-slate-100 max-w-md mx-auto">
          <div class="text-center mb-6">
            <i class="fa-solid fa-key text-4xl text-teal-500 mb-3"></i>
            <h2 class="text-2xl font-extrabold text-slate-700">Change Password</h2>
          </div>

          <form id="changePasswordForm" onsubmit="submitChangePassword(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Current Password</label>
              <input type="password" id="currentPasswordInput" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">New Password</label>
              <input type="password" id="newPasswordInput" required minlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
              <p class="text-xs text-slate-500 mt-1">Minimal 6 karakter</p>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Confirm New Password</label>
              <input type="password" id="confirmPasswordInput" required minlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2.5 rounded-lg transition">
              Update Password
            </button>
          </form>
        </div>
      </section>
